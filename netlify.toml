[build]
  publish = "web/public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/projects"
  to = "/.netlify/functions/projects"
  status = 200

[[redirects]]
  from = "/api/engines"
  to = "/.netlify/functions/engines"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
