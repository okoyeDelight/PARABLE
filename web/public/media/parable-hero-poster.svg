    <text x="600" y="370" text-anchor="middle" font-size="72" font-weight="700" letter-spacing="-3">Stories made visible.</text>
    <text x="600" y="420" text-anchor="middle" font-size="22" fill="#b9bec9">From the first line to the final frame.</text>
