<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="PARABLE product film poster">
  <defs>
    <radialGradient id="g" cx="50%" cy="42%" r="70%"><stop offset="0" stop-color="#253a82" stop-opacity=".58"/><stop offset=".42" stop-color="#12162a" stop-opacity=".66"/><stop offset="1" stop-color="#06070a"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6f78ff"/><stop offset=".52" stop-color="#8a5cff"/><stop offset="1" stop-color="#75d8ff"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>
  <rect width="1200" height="800" fill="#050609"/>
  <ellipse cx="600" cy="360" rx="380" ry="260" fill="#4f58ff" opacity=".14" filter="url(#blur)"/>
  <rect x="26" y="26" width="1148" height="748" rx="34" fill="url(#g)" stroke="#5666ff" stroke-opacity=".52" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#fff">
