name: PARABLE Render Foundation Smoke

on:
  push:
    branches: [immersive-v2]
    paths:
      - 'netlify/functions/_lib/render-foundation.mts'
      - 'netlify/functions/_lib/render-adapters.mts'
      - 'netlify/functions/_lib/render-router.mts'
      - 'netlify/functions/_lib/render-store.mts'
      - 'netlify/functions/_lib/render-budget-core.mts'
      - 'netlify/functions/_lib/render-budget.mts'
      - 'netlify/functions/visual-canon.mts'
      - 'netlify/functions/shot-compile.mts'
      - 'netlify/functions/render-route.mts'
      - 'netlify/functions/render-attempts.mts'
      - 'netlify/functions/render-dispatch.mts'
      - 'netlify/functions/render-provider-status.mts'
      - 'netlify/functions/render-qa.mts'
      - 'netlify/functions/render-budget.mts'
      - 'netlify/functions/keyframe-plan.mts'
      - 'web/public/studio.html'
      - 'web/public/studio.js'
      - 'web/public/studio-render.css'
      - 'tools/render_foundation_smoke.mts'
      - '.github/workflows/render-foundation-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parable-render-foundation-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Studio JavaScript syntax
        run: node --check web/public/studio.js

      - name: Run deterministic Render Engine smoke
        run: node tools/render_foundation_smoke.mts
