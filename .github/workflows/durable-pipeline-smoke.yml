name: PARABLE Durable Pipeline Smoke

on:
  push:
    branches: [immersive-v2]
    paths:
      - 'package.json'
      - 'netlify/functions/_lib/job-store.mts'
      - 'netlify/functions/jobs.mts'
      - 'netlify/functions/continuity-workload.mts'
      - 'netlify/functions/platform-health.mts'
      - '.github/workflows/durable-pipeline-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parable-durable-pipeline-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for this exact Deploy Preview
        env:
          PREVIEW_BASE: https://deploy-preview-1--parable-studio.netlify.app
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = process.env.PREVIEW_BASE;
          const expected = process.env.EXPECTED_SHA;
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          for (let attempt = 1; attempt <= 50; attempt++) {
            try {
              const r = await fetch(base + '/api/platform-health', { cache: 'no-store' });
              const body = await r.json().catch(() => ({}));
              const deployed = body?.deployment?.commit_ref;
              console.log(`attempt ${attempt}: status=${r.status} commit=${deployed || 'unknown'} expected=${expected}`);
              if (r.ok && body?.ok === true && deployed === expected) process.exit(0);
            } catch (error) {
              console.log(`attempt ${attempt}: ${error.message}`);
            }
            await sleep(6000);
          }
          throw new Error('The exact Deploy Preview did not become healthy in time.');
          NODE

      - name: Verify queue, execution, idempotency and conflict safety
        env:
          PREVIEW_BASE: https://deploy-preview-1--parable-studio.netlify.app
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = process.env.PREVIEW_BASE;
          const expected = process.env.EXPECTED_SHA;
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const key = 'ci-smoke-' + expected;
          const firstPayload = {
            kind: 'scale-noop',
            payload: { projectId: 'scale_probe', commit: expected, marker: 'first' }
          };

          async function submit(payload, idempotencyKey) {
            const r = await fetch(base + '/api/jobs', {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                'idempotency-key': idempotencyKey
              },
              body: JSON.stringify(payload)
            });
            const text = await r.text();
            let body; try { body = JSON.parse(text); } catch { body = text; }
            return { r, body };
          }

          const first = await submit(firstPayload, key);
          if (![200, 202].includes(first.r.status) || !first.body?.job?.id) {
            throw new Error('Queue submission failed: ' + first.r.status + ' ' + JSON.stringify(first.body));
          }
          const jobId = first.body.job.id;
          console.log('accepted job', jobId, 'event', first.body.job.queue_event_id || 'pending');

          let completed = null;
          for (let attempt = 1; attempt <= 40; attempt++) {
            const r = await fetch(base + '/api/jobs?id=' + encodeURIComponent(jobId), { cache: 'no-store' });
            const body = await r.json().catch(() => ({}));
            console.log(`poll ${attempt}: ${body?.job?.status}`);
            if (!r.ok) throw new Error('Job polling failed: ' + r.status);
            if (body?.job?.status === 'succeeded') {
              completed = body;
              break;
            }
            if (body?.job?.status === 'failed') {
              throw new Error('Durable job failed: ' + (body?.job?.last_error || 'unknown'));
            }
            await sleep(1500);
          }

          if (!completed?.result?.ok || completed.result?.probe !== 'durable-queue-v1') {
            throw new Error('Durable queue did not complete the scale-noop probe.');
          }

          const duplicate = await submit(firstPayload, key);
          if (duplicate.r.status !== 200 || duplicate.body?.job?.id !== jobId || duplicate.body?.deduplicated !== true) {
            throw new Error('Idempotent duplicate did not converge on the original job.');
          }

          const conflict = await submit({
            kind: 'scale-noop',
            payload: { projectId: 'scale_probe', commit: expected, marker: 'DIFFERENT' }
          }, key);

          if (conflict.r.status !== 409) {
            throw new Error('Idempotency conflict safety failed; expected 409, got ' + conflict.r.status);
          }

          console.log('PARABLE durable pipeline smoke passed: exact deploy healthy, queue accepted, worker executed, duplicate deduplicated, conflicting replay rejected.');
          NODE
