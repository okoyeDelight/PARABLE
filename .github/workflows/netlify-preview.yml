name: PARABLE Live Preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netlify-preview.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PARABLE
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: npm install

      - name: Deploy anonymous Netlify preview
        run: |
          set -o pipefail
          npx netlify-cli@latest deploy --build --prod --allow-anonymous 2>&1 | tee netlify-deploy.log
          echo "PARABLE_DEPLOY_OUTPUT_START"
          cat netlify-deploy.log
          echo "PARABLE_DEPLOY_OUTPUT_END"
