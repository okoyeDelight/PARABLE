name: PARABLE Story Understanding Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe one synthetic Story Understanding request
        env:
          PREVIEW_BASE: https://deploy-preview-1--parable-studio.netlify.app
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --max-time 30 -sS -X POST "$PREVIEW_BASE/api/ai-benchmark" -H 'content-type: application/json' --data '{"fixture":"altar","stage":"story"}')
          node -e 'const x=JSON.parse(process.argv[1]); console.log(JSON.stringify(x,null,2)); if(!x.passed || x.engine?.mode!=="model" || x.engine?.version!=="story-understanding-v2") process.exit(2);' "$response"
