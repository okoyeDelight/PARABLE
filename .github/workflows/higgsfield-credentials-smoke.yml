name: PARABLE Higgsfield Credentials Smoke

on:
  push:
    branches: [immersive-v2]
    paths:
      - 'netlify/functions/_lib/higgsfield-credentials.mts'
      - 'netlify/functions/_lib/render-router.mts'
      - 'netlify/functions/render-dispatch.mts'
      - 'tools/higgsfield_credentials_smoke.mts'
      - '.github/workflows/higgsfield-credentials-smoke.yml'
  workflow_dispatch:

jobs:
  credentials-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify combined and split Higgsfield credentials
        run: node tools/higgsfield_credentials_smoke.mts
